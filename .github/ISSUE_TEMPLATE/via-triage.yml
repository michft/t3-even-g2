name: G2 triage report
description: Record an agent investigation of a fork issue. For an uninvestigated problem, use G2 bug report.
labels:
  - via-triage
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form after an agent investigates a fork issue in a T3 project thread.
        This form records findings; it does not run an investigation.
        Keep one problem per issue and redact secrets and home directory paths.
        File fork issues in [michft/t3-even-g2](https://github.com/michft/t3-even-g2/issues).
        Escalate to T3 upstream only when evidence identifies a problem in upstream code.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the user's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in logs and source.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic repro if one was found.
      placeholder: |
        1. Open an older reply on G2, with the display awake.
        2. Tap the right arm once.
        3. Record whether the latest reply appears and whether dictation starts.
        Expected: latest reply in the same thread; no dictation.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Installed t3 version or commit.
      placeholder: 0.0.33
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, agent CLI versions if relevant.
      placeholder: macOS 15.3, Node 22.6, claude 2.1.0
    validations:
      required: true

  - type: textarea
    id: glasses
    attributes:
      label: Even G2 evidence (if applicable)
      description: >-
        Record the installed phone build and hardware context. Distinguish
        physical observations from simulated tests and successful Bluetooth writes.
      placeholder: |
        iOS / G2 firmware / R1 firmware:
        Installed native build commit:
        Input: R1 ring / left arm / right arm
        Natural scrolling: on / off
        Phone: unlocked / locked / app backgrounded
        Starting page -> exact gestures -> actual page:
        Relevant gesture.received / gesture.ignored log entries:
        Physical glasses result:
        Simulated checks and results:

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The most relevant log lines, trace entries, or stack traces only. Redacted.
      render: shell

  - type: input
    id: related
    attributes:
      label: Related issues
      description: Existing issues that look similar, and why this is not a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was run on the machine to unblock the user.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: Which agent and model produced this report.
      placeholder: Agent and model name, via a T3 project thread
