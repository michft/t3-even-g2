name: PR quality evidence

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to recheck
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  # Preserve removal events instead of replacing the pending revocation run.
  queue: max
  cancel-in-progress: false

jobs:
  evidence:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code executes with the status-write token.
      # PR files and comments are API data; never checkout or execute PR code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v8
        env:
          DISPATCH_PR: ${{ inputs.pull_request }}
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number
              ?? context.payload.issue?.number
              ?? Number(process.env.DISPATCH_PR);
            if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("A positive PR number is required.");
              return;
            }
            const { runQualityGate } = require("./.github/scripts/pr-quality.cjs");
            await runQualityGate({ github, context, core, pullNumber });
