name: Issue Labels

on:
  issues:
    types: [opened]
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync issue labels
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure managed issue labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const managedLabels = [
              {
                name: "bug",
                color: "d73a4a",
                description: "Something is broken or behaving incorrectly.",
              },
              {
                name: "enhancement",
                color: "a2eeef",
                description: "Requested improvement or new capability.",
              },
              {
                name: "needs-triage",
                color: "fbca04",
                description: "Issue needs maintainer review and initial categorization.",
              },
              {
                name: "needs-info",
                color: "d876e3",
                description: "Waiting for information from the reporter.",
              },
              {
                name: "ready-for-agent",
                color: "0e8a16",
                description: "Accepted and specified for an assigned agent to implement.",
              },
              {
                name: "ready-for-human",
                color: "1d76db",
                description: "Accepted work requiring human implementation or judgment.",
              },
              {
                name: "wontfix",
                color: "ffffff",
                description: "This will not be worked on.",
              },
              {
                name: "via-triage",
                color: "c5def5",
                description: "Report includes an agent investigation.",
              },
            ];

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
      - name: Queue new issues for triage
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const states = new Set([
              "needs-triage", "needs-info", "ready-for-agent",
              "ready-for-human", "wontfix",
            ]);
            if (issue.state === "open" && !issue.labels.some((label) => states.has(label.name))) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: ["needs-triage"],
              });
            }
